# Ambiente de DESENVOLVIMENTO
#   cp .env.example .env && docker compose up
#   docker compose watch                 (sync de src/, rebuild em package.json)
#   docker compose --profile tools up -d (Adminer em http://localhost:8081)

x-app-build: &app-build
  context: .
  target: dev

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: ${DB_USER:?defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?defina DB_NAME no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - flags-net

  # Execucao unica: aplica as migracoes (idempotente) antes de o app subir.
  migrate:
    build: *app-build
    image: flags-api-dev
    env_file: .env
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flags-net

  app:
    build: *app-build
    image: flags-api-dev
    env_file: .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        # Codigo: copiado para dentro do container; o tsx watch recarrega sozinho.
        - action: sync
          path: ./src
          target: /app/src
        # Dependencias: exigem reinstalar -> rebuild da imagem.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    networks:
      - flags-net

  # Cliente de banco, so com: docker compose --profile tools up -d
  adminer:
    image: adminer:6.1.0
    profiles:
      - tools
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - flags-net

volumes:
  pgdata:

networks:
  flags-net:
    driver: bridge
